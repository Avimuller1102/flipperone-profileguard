name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly upstream drift check

permissions:
  contents: read

env:
  # Scenarios that fail on the bundled dev@bb92d87 snapshot today, and why:
  # AM-10 contract violation already fixed by flipperos-btrfs-tools PR #4 (unmerged);
  # AM-11, AM-13 findings against proposed invariants (questions for maintainers).
  # `profileguard test --expect-fail` exits 0 only if exactly these fail on every awk.
  KNOWN_FAILURES: AM-10,AM-11,AM-13

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-latest, python: "3.12" } # the system awk only (BWK awk); macos-14 was retired
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install awk implementations and shells
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mawk gawk busybox original-awk dash
      - run: python -m pip install -e ".[dev]"

      - name: Dependencies present (exit 2 means missing)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            profileguard doctor --require mawk --require gawk --require busybox --require original-awk
          else
            profileguard doctor --require awk
          fi

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -v --junitxml=pytest-results.xml

      - name: Upstream snapshot fails exactly the known scenarios
        # 0 = as expected; 1 = a scenario failed or passed unexpectedly; 3 = awk execution error
        run: profileguard test --all-awks --expect-fail "$KNOWN_FAILURES" --json report.json --html report.html

      - name: Report is complete and valid
        run: |
          profileguard report report.json
          test -s report.html

      - name: Synthetic regression is detected (must exit exactly 1)
        run: |
          set +e
          profileguard compare --baseline snapshot --candidate synthetic-defect --all-awks > synthetic.txt
          rc=$?
          set -e
          cat synthetic.txt
          if [ "$rc" -ne 1 ]; then echo "::error::expected exit 1 (regression), got $rc"; exit 1; fi
          grep -q '^regressed *AM-01 ' synthetic.txt
          grep -q '^regressed *AM-04 ' synthetic.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            report.json
            report.html
            synthetic.txt
            pytest-results.xml
          if-no-files-found: warn

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build a wheel and run it from a clean virtualenv
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/profileguard doctor
          /tmp/clean/bin/profileguard test --expect-fail "$KNOWN_FAILURES" --json /tmp/r.json
          /tmp/clean/bin/profileguard report /tmp/r.json

  upstream-drift:
    # Runs today's upstream dev (merged code of the official repository only) against the
    # bundled snapshot. Fails on a regression or an execution error, warns when the script
    # changed, and reports clone failures as infrastructure problems.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q mawk gawk busybox original-awk
      - run: python -m pip install .
      - name: Clone upstream (retried; failure here is infrastructure, not a finding)
        run: |
          for i in 1 2 3; do
            git clone --quiet https://github.com/flipperdevices/flipperos-btrfs-tools upstream && exit 0
            rm -rf upstream; sleep $((i * 15))
          done
          echo "::error::could not clone flipperos-btrfs-tools (network or GitHub outage)"; exit 1
      - name: Compare upstream dev with the snapshot
        run: |
          set +e
          profileguard compare --repo upstream --baseline snapshot --candidate origin/dev --all-awks > drift.txt
          rc=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < drift.txt
          now=$(git -C upstream rev-parse origin/dev:libs/flipper-accountdb.awk 2>/dev/null || echo missing)
          pinned=$(python -c "from profileguard.targets import SNAPSHOT_BLOB; print(SNAPSHOT_BLOB)")
          if [ "$now" != "$pinned" ]; then
            echo "::warning::upstream flipper-accountdb.awk changed ($pinned -> $now); review it and update the snapshot"
          fi
          case $rc in
            0) echo "no regression against the snapshot" ;;
            1) echo "::error::upstream dev regressed a contract scenario"; exit 1 ;;
            2) echo "::error::upstream layout changed or the script is gone"; exit 1 ;;
            3) echo "::error::awk execution error on upstream dev"; exit 1 ;;
            *) echo "::error::unexpected exit $rc"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upstream-drift
          path: drift.txt
          if-no-files-found: warn
