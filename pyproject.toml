[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipperone-profileguard"
version = "0.1.0"
description = "Security scenarios for the account-database merge used by Flipper OS profile migration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/profileguard/upstream_snapshot/LICENSE.flipperos-btrfs-tools"]
authors = [{ name = "Avinoam Muller" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
profileguard = "profileguard.cli:main"

[project.urls]
Source = "https://github.com/avimuller1102/flipperone-profileguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
profileguard = ["upstream_snapshot/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/profileguard"]
